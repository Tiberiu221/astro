# /etc/nginx/sites-available/astro-demo  (symlinked into sites-enabled)
# Static Astro build: nginx serves the files in /var/www/astro-demo directly, no Node process at runtime.
# Port 8081 so it coexists with the vps-demo reverse proxy on port 80. Open it once: ufw allow 8081/tcp
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/astro-demo;
    index index.html;

    # Compress text responses (Ubuntu's nginx.conf compresses only text/html by default).
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/xml application/rss+xml
               application/javascript text/javascript application/json image/svg+xml;

    # Astro writes CSS/JS to /_astro/ with a content hash in the file name: a change means a new name,
    # so browsers and CDNs may keep these for a year without asking again.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML, RSS, sitemap: revalidate on every request (ETag / Last-Modified, cheap 304s),
    # so a redeploy is visible at once. /despre -> /despre/index.html via $uri/.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}

# -----------------------------------------------------------------------------------------------
# Variant for a real domain instead of :8081: the same block on port 80 with a server_name.
# nginx picks the server block by the Host header, so it lives next to vps-demo's default_server.
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name demo.ofai.ro;
#
#     root /var/www/astro-demo;
#     index index.html;
#     # ...gzip, the two location blocks and error_page exactly as above
# }
#
# DNS + SSL path (needs a public IP, e.g. a Hetzner VPS; a Multipass VM is only reachable from the Mac):
#  1. Cloudflare -> DNS -> Add record: type A, name "demo", IPv4 = the VPS IP. Create it as "DNS only"
#     (grey cloud) so Let's Encrypt reaches nginx directly for the first certificate.
#  2. On the server:  apt-get install -y certbot python3-certbot-nginx
#                     certbot --nginx -d demo.ofai.ro
#     certbot adds "listen 443 ssl" + the certificate to this block and an HTTP -> HTTPS redirect;
#     a systemd timer renews it (test: certbot renew --dry-run).
#  3. Cloudflare: switch the record to "Proxied" (orange cloud) and set SSL/TLS mode to "Full (strict)":
#     browser -> Cloudflare and Cloudflare -> nginx are both HTTPS, and Cloudflare verifies the origin
#     certificate. Avoid "Flexible": Cloudflare would talk HTTP to nginx and certbot's redirect would loop.
#  4. astro.config.mjs: site: 'https://demo.ofai.ro', then build and deploy again.
#  Behind the proxy nginx sees Cloudflare's IPs; for real client IPs in the logs use
#  set_real_ip_from <Cloudflare ranges>; real_ip_header CF-Connecting-IP;
